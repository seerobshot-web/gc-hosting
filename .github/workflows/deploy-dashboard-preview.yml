name: Deploy dashboard preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Check GitHub Pages availability
        id: pages-site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth_scheme="Authorization: Bearer "
          status="$(curl -sS -o /tmp/pages-site.json -w "%{http_code}" \
            -H "${auth_scheme}${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"

          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          elif [ "${status}" = "404" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}; skipping dashboard preview deployment."
          else
            cat /tmp/pages-site.json
            exit 1
          fi

      - name: Configure GitHub Pages
        if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard preview
        run: pnpm --filter @gch/web build

      - name: Upload Pages artifact
        if: steps.pages-site.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        if: steps.pages-site.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
