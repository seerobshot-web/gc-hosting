name: Deploy dashboard preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Configure GitHub Pages
        if: vars.GITHUB_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dashboard preview
        run: pnpm --filter @gch/web build

      - name: Skip GitHub Pages deployment
        if: vars.GITHUB_PAGES_ENABLED != 'true'
        run: echo "::notice::GitHub Pages deployment is disabled. Enable GitHub Pages for this repository and set the GITHUB_PAGES_ENABLED repository variable to true to publish the dashboard preview."

      - name: Upload Pages artifact
        if: vars.GITHUB_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        if: vars.GITHUB_PAGES_ENABLED == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
