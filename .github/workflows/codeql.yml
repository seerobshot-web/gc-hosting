name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Detect Code Scanning availability
        id: code-scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS --oauth2-bearer "$GH_TOKEN" -o /tmp/code-scanning-response.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/analyses?per_page=1")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif { [ "$status" = "403" ] || [ "$status" = "404" ]; } && \
            grep -Eqi 'code scanning is not enabled|advanced security must be enabled' /tmp/code-scanning-response.json; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code scanning is not enabled for this repository; skipping CodeQL analysis."
          else
            echo "Unexpected code scanning API response: $status"
            cat /tmp/code-scanning-response.json
            exit 1
          fi

      - name: Initialize CodeQL
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4
