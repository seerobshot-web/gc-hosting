name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Detect Code Scanning availability
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    outputs:
      enabled: ${{ steps.code-scanning.outputs.enabled }}
    steps:
      - name: Detect Code Scanning availability
        id: code-scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/code-scanning-response.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")
          disabled=$(python - /tmp/code-scanning-response.json <<'PY'
          import json
          import sys

          # The alerts endpoint does not expose a dedicated machine-readable
          # "feature disabled" code. Treat only the known disabled/not-enabled
          # responses as a clean skip; any other 403 must fail fast so token or
          # policy problems stay visible.
          with open(sys.argv[1]) as response_file:
              data = json.load(response_file)

          disabled_messages = {
              "Code scanning is not enabled for this repository. Please enable code scanning in the repository settings.",
              "Advanced Security must be enabled for this repository to use code scanning.",
          }

          print("true" if isinstance(data, dict) and data.get("message") in disabled_messages else "false")
          PY
          )

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "403" ] && [ "$disabled" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code scanning is not enabled for this repository; skipping CodeQL analysis."
          else
            echo "Unexpected code scanning API response: $status"
            cat /tmp/code-scanning-response.json
            exit 1
          fi

  analyze:
    name: Analyze JavaScript and TypeScript
    needs: probe
    if: needs.probe.outputs.enabled == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
